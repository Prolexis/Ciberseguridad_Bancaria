services:
  # Base de Datos Relacional Principal con soporte JSONB e índices pg_trgm
  postgres:
    image: postgres:15-alpine
    container_name: aegis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis_secops
      POSTGRES_PASSWORD: AegisSecurePass2026!#
      POSTGRES_DB: aegis_antiphishing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_secops -d aegis_antiphishing"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis para Rate Limiting, Caché distribuido y colas de tareas
  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend FastAPI (Python 3.11+, SQLAlchemy 2.0, LangChain)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis_backend
    restart: unless-stopped
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=aegis_secops
      - POSTGRES_PASSWORD=AegisSecurePass2026!#
      - POSTGRES_DB=aegis_antiphishing
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - N8N_WEBHOOK_URL_CRITICAL_ALERT=http://n8n:5678/webhook/aegis-critical-alert
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started

  # Frontend React 18+ (Vite, TypeScript, TailwindCSS, Recharts)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Orquestador de Flujos y Automatización n8n
  n8n:
    image: n8nio/n8n:latest
    container_name: aegis_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.banco.internal
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Mexico_City
    volumes:
      - n8n_data:/home/node/.n8n

  # Contenedor Ollama para Inferencia Local de LLM On-Premise
  ollama:
    image: ollama/ollama:latest
    container_name: aegis_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # Prometheus para métricas del RED method
  prometheus:
    image: prom/prometheus:latest
    container_name: aegis_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  # Grafana para visualización de dashboards SOC
  grafana:
    image: grafana/grafana:latest
    container_name: aegis_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=GrafanaAdmin2026!
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  ollama_models:

